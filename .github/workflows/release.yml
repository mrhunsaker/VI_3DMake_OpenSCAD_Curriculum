name: Build and Release mdBook with Pandoc and LaTeX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc 3.6.4
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-1-amd64.deb
          sudo dpkg -i pandoc-3.6.4-1-amd64.deb
          pandoc --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install mdBook and mdbook-pandoc
        run: |
          cargo install mdbook --locked
          cargo install mdbook-pandoc --locked

      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-luatex \
            texlive-xetex \
            lmodern \
            fonts-atkinson-hyperlegible

      - name: Install Atkinson Hyperlegible Mono fonts
        run: |
          # Create font directory
          mkdir -p ~/.local/share/fonts/atkinson-hyperlegible
          
          # Download Atkinson Hyperlegible font family from Google Fonts
          wget -q https://github.com/googlefonts/atkinson-hyperlegible/raw/main/fonts/otf/Atkinson-Hyperlegible-Regular.otf -O ~/.local/share/fonts/atkinson-hyperlegible/Atkinson-Hyperlegible-Regular.otf
          wget -q https://github.com/googlefonts/atkinson-hyperlegible/raw/main/fonts/otf/Atkinson-Hyperlegible-Bold.otf -O ~/.local/share/fonts/atkinson-hyperlegible/Atkinson-Hyperlegible-Bold.otf
          wget -q https://github.com/googlefonts/atkinson-hyperlegible/raw/main/fonts/otf/Atkinson-Hyperlegible-Italic.otf -O ~/.local/share/fonts/atkinson-hyperlegible/Atkinson-Hyperlegible-Italic.otf
          wget -q https://github.com/googlefonts/atkinson-hyperlegible/raw/main/fonts/otf/Atkinson-Hyperlegible-BoldItalic.otf -O ~/.local/share/fonts/atkinson-hyperlegible/Atkinson-Hyperlegible-BoldItalic.otf
          
          # Download Mono variants if available (fallback to regular if not)
          wget -q https://github.com/googlefonts/atkinson-hyperlegible/raw/main/fonts/otf/AtkinsonHyperlegible-Regular.otf -O ~/.local/share/fonts/atkinson-hyperlegible/AtkinsonHyperlegibleMono-Regular.otf 2>/dev/null || \
            cp ~/.local/share/fonts/atkinson-hyperlegible/Atkinson-Hyperlegible-Regular.otf ~/.local/share/fonts/atkinson-hyperlegible/AtkinsonHyperlegibleMono-Regular.otf
          
          wget -q https://github.com/googlefonts/atkinson-hyperlegible/raw/main/fonts/otf/AtkinsonHyperlegible-Bold.otf -O ~/.local/share/fonts/atkinson-hyperlegible/AtkinsonHyperlegibleMono-Bold.otf 2>/dev/null || \
            cp ~/.local/share/fonts/atkinson-hyperlegible/Atkinson-Hyperlegible-Bold.otf ~/.local/share/fonts/atkinson-hyperlegible/AtkinsonHyperlegibleMono-Bold.otf
          
          wget -q https://github.com/googlefonts/atkinson-hyperlegible/raw/main/fonts/otf/AtkinsonHyperlegible-Italic.otf -O ~/.local/share/fonts/atkinson-hyperlegible/AtkinsonHyperlegibleMono-Italic.otf 2>/dev/null || \
            cp ~/.local/share/fonts/atkinson-hyperlegible/Atkinson-Hyperlegible-Italic.otf ~/.local/share/fonts/atkinson-hyperlegible/AtkinsonHyperlegibleMono-Italic.otf
          
          wget -q https://github.com/googlefonts/atkinson-hyperlegible/raw/main/fonts/otf/AtkinsonHyperlegible-BoldItalic.otf -O ~/.local/share/fonts/atkinson-hyperlegible/AtkinsonHyperlegibleMono-BoldItalic.otf 2>/dev/null || \
            cp ~/.local/share/fonts/atkinson-hyperlegible/Atkinson-Hyperlegible-BoldItalic.otf ~/.local/share/fonts/atkinson-hyperlegible/AtkinsonHyperlegibleMono-BoldItalic.otf
          
          # Refresh font cache
          fc-cache -fv
          
          # Verify fonts are installed
          fc-list | grep -i atkinson || echo "Warning: Atkinson fonts may not be properly installed"

      # IDENTICAL to deploy.yml
      - name: Build book (all backends)
        run: |
          cd my-book
          mdbook build

      - name: Copy source assets into latex output directory
        run: |
          cp -r my-book/src my-book/docs/pandoc/latex/src

      - name: Compile LaTeX → PDF
        run: |
          OUT_DIR="my-book/docs/pandoc/latex"
          TEX="OpenSCAD_Curriculum.tex"

          cd "$OUT_DIR"

          # Pass 1
          lualatex --interaction=nonstopmode "$TEX"

          # Build index
          makeindex "OpenSCAD_Curriculum.idx" || true

          # Pass 2
          lualatex --interaction=nonstopmode "$TEX"

      - name: Verify release artifacts exist
        run: |
          test -f my-book/docs/pandoc/epub/OpenSCAD_Curriculum.epub
          test -f my-book/docs/pandoc/latex/OpenSCAD_Curriculum.tex
          test -f my-book/docs/pandoc/latex/OpenSCAD_Curriculum.pdf

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            my-book/docs/pandoc/epub/OpenSCAD_Curriculum.epub
            my-book/docs/pandoc/latex/OpenSCAD_Curriculum.tex
            my-book/docs/pandoc/latex/OpenSCAD_Curriculum.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
